name: zambian_curriculum_app
description: Offline Zambian curriculum syllabus companion for teachers.
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  sqflite: ^2.3.3
  path: ^1.9.0
  path_provider: ^2.1.4
  connectivity_plus: ^6.0.5
  firebase_core: ^3.8.0
  firebase_auth: ^5.3.3
  cloud_functions: ^5.1.4
  pdf: ^3.11.1
  archive: ^4.0.9
  share_plus: ^13.3.0
  http: ^1.2.2
  shared_preferences: ^2.3.2
  file_picker: ^12.0.0
  xml: ^6.5.0
  document_camera_frame: ^2.6.11
  file_saver: ^0.4.0
  syncfusion_flutter_pdf: ^33.2.13
  pdf_manipulator: 4.1.0
  # google_mobile_ads REMOVED (2026-08-30): confirmed root cause of an
  # app-wide crash-on-launch on a real device (Moto G05), isolated via two
  # separate diagnostic test builds. See rewarded_ad_service.dart for the
  # full removal note and what re-adding this properly would require.

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true
