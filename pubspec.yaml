# Run `flutter pub run flutter_launcher_icons` after `flutter create` (see
# README Setup) to generate android/ios launcher icons from assets/icon/.
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon/icon.png
  adaptive_icon_background: "#1565C0"
  adaptive_icon_foreground: assets/icon/icon_foreground.png

# Run `flutter pub run flutter_native_splash:create` after `flutter create`
# to generate the native splash screen from this config.
flutter_native_splash:
  color: "#1565C0"
  image: assets/icon/icon_foreground.png
  color_dark: "#0D1F33"
  image_dark: assets/icon/icon_foreground.png
  android_12:
    color: "#1565C0"
    image: assets/icon/icon_foreground.png
    color_dark: "#0D1F33"
    image_dark: assets/icon/icon_foreground.png
