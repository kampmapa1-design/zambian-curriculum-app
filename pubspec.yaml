name: zambian_curriculum_app
description: Offline Zambian curriculum syllabus companion for teachers.
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  sqflite: ^2.3.3
  path: ^1.9.0
  path_provider: ^2.1.4
  connectivity_plus: ^6.0.5
  firebase_core: ^3.8.0
  firebase_auth: ^5.3.3
  cloud_functions: ^5.1.4
  pdf: ^3.11.1
  archive: ^4.0.9
  share_plus: ^13.3.0
  http: ^1.2.2
  shared_preferences: ^2.3.2
  file_picker: ^12.0.0
  xml: ^6.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true
  assets:
    - assets/syllabi/manifest.json
    - assets/syllabi/math_grade8.json
    - assets/syllabi/english_grade8.json
    - assets/syllabi/obc2013_english_form3_placeholder.json
    - assets/syllabi/history_form1.json
    - assets/syllabi/geography_grade10.json
    - assets/syllabi/geography_grade11.json
    - assets/syllabi/geography_grade12.json
    - assets/syllabi/civic_education_grade10.json
    - assets/syllabi/civic_education_grade11.json
    - assets/syllabi/civic_education_grade12.json
    - assets/syllabi/religious_education_grade10.json
    - assets/syllabi/religious_education_grade11.json
    - assets/syllabi/religious_education_grade12.json
    - assets/syllabi/history_grade10.json
    - assets/syllabi/history_grade11.json
    - assets/syllabi/history_grade12.json
    - assets/syllabi/biology_grade10.json
    - assets/syllabi/biology_grade11.json
    - assets/syllabi/biology_grade12.json
    - assets/syllabi/mathematics_grade10.json
    - assets/syllabi/mathematics_grade11.json
    - assets/syllabi/mathematics_grade12.json
    - assets/syllabi/physics_grade10.json
    - assets/syllabi/physics_grade11.json
    - assets/syllabi/physics_grade12.json
    - assets/syllabi/chemistry_grade10.json
    - assets/syllabi/chemistry_grade11.json
    - assets/syllabi/chemistry_grade12.json
    - assets/activity_banks/manifest.json
    - assets/activity_banks/hist_f1_1_1_1.json
    - assets/rules/cdc_constraints.example.json
    - assets/rules/cbc_2023_constraints.json
    - assets/cdc_resources/seed_catalog.json
    - assets/icon/icon.png

# Run `flutter pub run flutter_launcher_icons` after `flutter create` (see
# README Setup) to generate android/ios launcher icons from assets/icon/.
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon/icon.png
  adaptive_icon_background: "#1565C0"
  adaptive_icon_foreground: assets/icon/icon_foreground.png

# Run `flutter pub run flutter_native_splash:create` after `flutter create`
# to generate the native splash screen from this config.
flutter_native_splash:
  color: "#1565C0"
  image: assets/icon/icon_foreground.png
  color_dark: "#0D1F33"
  image_dark: assets/icon/icon_foreground.png
  android_12:
    color: "#1565C0"
    image: assets/icon/icon_foreground.png
    color_dark: "#0D1F33"
    image_dark: assets/icon/icon_foreground.png
