workflows:
  android-apk:
    name: Android APK (unsigned, sideload build)
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      flutter: stable
    cache:
      cache_paths:
        - $HOME/.pub-cache
    scripts:
      - name: Generate Android platform scaffolding if missing
        script: |
          # This repo was written before the android/ folder existed locally
          # (see README.md). flutter create is safe to re-run against an
          # existing project — it only fills in missing platform files.
          if [ ! -d android ]; then
            flutter create . --platforms=android --project-name zambian_curriculum_app --org com.example.zambiancurriculum
          fi
      - name: Bump Android compileSdk (file_picker's transitive deps need 36+)
        script: |
          # flutter create's default (flutter.compileSdkVersion, currently 34
          # on this Flutter channel) is older than what file_picker's
          # flutter_plugin_android_lifecycle dependency requires. Diagnostic
          # echoes are deliberate: this line is one of the few things about
          # the freshly-generated android/ folder we can't inspect locally
          # (Flutter isn't installed on the machine developing this app), so
          # the build log is the only window into its exact contents.
          echo "--- before ---"
          grep -n "compileSdk" android/app/build.gradle.kts android/app/build.gradle 2>/dev/null || echo "no compileSdk line found in either file"
          # macOS's sed needs an argument to -i (hence -i.bak, not just -i).
          # Matches any line containing both compileSdk and
          # flutter.compileSdkVersion, regardless of exact spacing/prefix.
          if [ -f android/app/build.gradle.kts ]; then
            sed -i.bak '/compileSdk.*flutter\.compileSdkVersion/s/flutter\.compileSdkVersion/36/' android/app/build.gradle.kts
          fi
          if [ -f android/app/build.gradle ]; then
            sed -i.bak '/compileSdk.*flutter\.compileSdkVersion/s/flutter\.compileSdkVersion/36/' android/app/build.gradle
          fi
          echo "--- after ---"
          grep -n "compileSdk" android/app/build.gradle.kts android/app/build.gradle 2>/dev/null || echo "no compileSdk line found in either file"
      - name: Get Flutter packages
        script: flutter pub get
      - name: Build debug APK
        script: flutter build apk --debug
      - name: Build release APK (unsigned)
        script: |
          # Uses Flutter's default debug signing config for the release
          # build type, so no keystore setup is required.
          flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
